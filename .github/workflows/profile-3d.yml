name: GitHub-Profile-3D-Contrib

on:
  push:
    branches: [master]
    paths-ignore:
      - 'profile-3d-contrib/**'
  schedule:
    - cron: "31 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v2
      - uses: yoshi389111/github-profile-3d-contrib@0.4.0
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          MAX_REPOS: 250
      - name: Commit & Push
        run: |
          git config user.name ${{ github.repository_owner }}
          git config user.email "203715395+kelly26ici@users.noreply.github.com"
          git add -A .
          git commit -m "GitHub 3D Profile"
          git push
